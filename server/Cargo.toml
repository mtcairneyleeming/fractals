[package]
name = "server"
version = "0.2.0"
authors = ["Max Cairney-Leeming <max@cairneyleeming.co.uk>"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "server"
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
rocket = { version = "0.5", features = ["msgpack"] }
serde = { version = "1.0", features = ["derive"] }
stl_io = "0.11"
log = "0.4"

[dev-dependencies]
serde_json = "1.0"
sha2 = "0.10"
rmp-serde = "1"

[profile.release]
debug = true
